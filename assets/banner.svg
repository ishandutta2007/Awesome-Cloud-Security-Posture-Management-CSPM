<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cyan to Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Purple Accent Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Radial Background Glows -->
    <radialGradient id="radialCyan" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radialPurple" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Radial Glow Overlay -->
  <rect width="1200" height="300" rx="16" fill="url(#radialCyan)" />
  <rect width="1200" height="300" rx="16" fill="url(#radialPurple)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240" />
    <path d="M 150 0 L 150 300 M 300 0 L 300 300 M 450 0 L 450 300 M 600 0 L 600 300 M 750 0 L 750 300 M 900 0 L 900 300 M 1050 0 L 1050 300" />
  </g>

  <!-- Decorative Graphic: Interconnected Nodes & Shield Emblem on Right Side -->
  <g transform="translate(940, 150)">
    <!-- Concentric Decorative Circles -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.4" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" />
    <circle cx="0" cy="0" r="55" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.8" />

    <!-- Shield Icon -->
    <path d="M 0 -28 L 22 -15 L 22 8 C 22 22 0 30 0 30 C 0 30 -22 22 -22 8 L -22 -15 Z" fill="url(#cyanGrad)" opacity="0.2" />
    <path d="M 0 -28 L 22 -15 L 22 8 C 22 22 0 30 0 30 C 0 30 -22 22 -22 8 L -22 -15 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Checkmark inside Shield -->
    <path d="M -8 1 L -2 7 L 10 -5" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Satellite Orbiting Nodes -->
    <g transform="translate(-75, -45)">
      <line x1="0" y1="0" x2="35" y2="20" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
      <circle cx="0" cy="0" r="7" fill="#38bdf8" />
    </g>
    <g transform="translate(80, 35)">
      <line x1="0" y1="0" x2="-35" y2="-15" stroke="#c084fc" stroke-width="1.5" opacity="0.5" />
      <circle cx="0" cy="0" r="8" fill="#c084fc" />
    </g>
    <g transform="translate(-50, 65)">
      <line x1="0" y1="0" x2="20" y2="-25" stroke="#67e8f9" stroke-width="1.5" opacity="0.5" />
      <circle cx="0" cy="0" r="5" fill="#67e8f9" />
    </g>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(60, 65)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="270" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Shield Icon in Badge -->
      <path d="M 18 8 L 26 12 L 26 18 C 26 23 18 26 18 26 C 18 26 10 23 10 18 L 10 12 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#38bdf8" letter-spacing="0.5">AWS • AZURE • GCP • KUBERNETES</text>
    </g>

    <!-- Main Title Lines -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="#ffffff">Awesome Cloud Security Posture</text>
    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="url(#cyanGrad)">Management (CSPM)</text>

    <!-- Subtitle -->
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="19" fill="#94a3b8">Curated SaaS Platforms, Enterprise CNAPP &amp; Open-Source Security Tools</text>
  </g>
</svg>
